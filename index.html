<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БАКЫТ - Шақыру</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 { color: #d4af37; text-align: center; margin-bottom: 20px; margin-top: 0; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px 0;
            border: 1px solid #d4af37;
            border-radius: 8px;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 8px;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .radio-group { margin: 12px 0; }
        .radio-group label { display: block; margin: 8px 0; cursor: pointer; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #2a2a2a; padding: 12px; border-radius: 8px; text-align: center; }
        .stat-num { font-size: 20px; font-weight: bold; color: #d4af37; }
        .guest-card { background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <!-- Форма для гостей -->
    <div id="guest-view">
        <h2>Жауап беру</h2>
        <form id="rsvp-form">
            <label>Аты-жөніңіз:</label>
            <input type="text" id="guestName" required placeholder="Мысалы: Арман">
            
            <div class="radio-group">
                <label><input type="radio" name="status" value="Келемін" checked> Келемін</label>
                <label><input type="radio" name="status" value="Жұбайымен келемін"> Жұбайымен келемін</label>
                <label><input type="radio" name="status" value="Өкінішке орай, келе алмаймын"> Келе алмаймын</label>
            </div>

            <button type="submit" class="btn" id="submitBtn">Жіберу</button>
        </form>
        <div id="statusMsg" style="text-align: center; margin-top: 10px;"></div>
    </div>

    <!-- Админ панель -->
    <div id="admin-view" class="hidden">
        <h2>Қонақтар тізімі</h2>
        <div class="stats-grid">
            <div class="stat-card">Барлығы<div class="stat-num" id="totalCount">0</div></div>
            <div class="stat-card">Келеді<div class="stat-num" id="attendingCount">0</div></div>
        </div>
        <input type="text" id="searchInput" onkeyup="filterGuests()" placeholder="Издеу...">
        <div id="guestList"></div>
        <button onclick="exportCSV()" class="btn" style="background: #4CAF50; color: white;">CSV жүктеу</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNOJ7TWiaPgz7F_qmOTao6wb7dqveHvzIjvU2whZiN1bwL8WSNtB023Ve6jHFWpNw/exec";
    let allResponses = [];

    // Проверка режима (гость или админ)
    if (window.location.hash === '#admin') {
        document.getElementById('guest-view').classList.add('hidden');
        document.getElementById('admin-view').classList.remove('hidden');
        loadAdminData();
    }

    // Отправка формы гостя
    document.getElementById('rsvp-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('statusMsg');
        btn.disabled = true;
        msg.innerText = "Жіберілуде...";

        const name = document.getElementById('guestName').value;
        const status = document.querySelector('input[name="status"]:checked').value;
        const guestCount = status === 'Жұбайымен келемін' ? 2 : (status === 'Келемін' ? 1 : 0);

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, status, guestCount })
        })
        .then(() => {
            msg.innerText = "Рақмет! Жауабыңыз қабылданды.";
            document.getElementById('rsvp-form').reset();
            btn.disabled = false;
        })
        .catch(err => {
            msg.innerText = "Қате орын алды. Қайталап көрiңiз.";
            btn.disabled = false;
        });
    });

    // Загрузка данных для админки
    function loadAdminData() {
        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                allResponses = data;
                renderAdmin(data);
            })
            .catch(() => {
                document.getElementById('guestList').innerHTML = "<p style='text-align:center;'>Деректерді жүктеу қатесі</p>";
            });
    }

    function renderAdmin(data) {
        let total = 0;
        let attending = 0;

        data.forEach(item => {
            total++;
            attending += Number(item.guestCount || 0);
        });

        document.getElementById('totalCount').innerText = total;
        document.getElementById('attendingCount').innerText = attending;

        renderList(data);
    }

    function renderList(data) {
        const listDiv = document.getElementById('guestList');
        if (!data || data.length === 0) {
            listDiv.innerHTML = "<p style='text-align:center; color:#888;'>Жауаптар жоқ</p>";
            return;
        }

        listDiv.innerHTML = data.slice().reverse().map(item => `
            <div class="guest-card">
                <div>
                    <strong>${item.name}</strong>
                    <div style="font-size:12px; color:#aaa;">${item.status}</div>
                </div>
            </div>
        `).join('');
    }

    function filterGuests() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allResponses.filter(r => r.name.toLowerCase().includes(query));
        renderList(filtered);
    }

    function exportCSV() {
        let csvContent = "data:text/csv;charset=utf-8,Name,Status,GuestCount\n";
        allResponses.forEach(r => {
            csvContent += `"${r.name}","${r.status}",${r.guestCount}\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "wedding_guests.csv");
        document.body.appendChild(link);
        link.click();
    }
</script>

</body>
</html>
